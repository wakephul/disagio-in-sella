<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title id="page-title">Itinerario — Disagio in Sella</title>
<meta name="description" id="page-desc" content="Dettaglio itinerario ciclabile con mappa e traccia GPX." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..600&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/pages.css" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23e8643c'/%3E%3C/svg%3E">
</head>
<body>

<header class="topbar">
  <a class="brand" href="index.html"><span class="dot"></span> Disagio in Sella</a>
  <div class="topbar-actions"><button class="theme-toggle" aria-label="Cambia tema chiaro/scuro"></button><button class="burger" aria-label="Apri il menu" aria-expanded="false"><span></span><span></span><span></span></button></div>
</header>
<nav class="overlay" aria-label="Menu principale">
  <button class="overlay-close" aria-label="Chiudi menu">&#x2715;</button>
  <ul class="menu">
    <li><a href="index.html"><span class="idx">01</span> Home</a></li>
    <li><a href="itinerari.html"><span class="idx">02</span> Itinerari</a></li>
    <li><a href="gpx.html"><span class="idx">03</span> Genera il tuo GPX</a></li>
</ul>

</nav>

<!-- HERO -->
<div class="detail-hero" id="detail-hero">
  <div class="detail-hero-bg">
    <img id="detail-img" src="" alt="">
  </div>
  <div class="detail-hero-overlay"></div>
  <div class="wrap detail-hero-content">
    <a class="detail-back" href="itinerari.html">← Tutti gli itinerari</a>
    <p class="eyebrow" id="detail-region"></p>
    <h1 id="detail-title"></h1>
    <div class="detail-badges" id="detail-badges"></div>
  </div>
</div>

<!-- STATS BAR -->
<div class="detail-statsbar" id="detail-statsbar">
  <div class="wrap detail-statsbar-inner">
    <div class="detail-stat"><span class="n" id="d-dist">—</span><span class="k">km totali</span></div>
    <div class="detail-stat"><span class="n" id="d-days">—</span><span class="k">giorni</span></div>
    <div class="detail-stat"><span class="n" id="d-ascent">—</span><span class="k">m D+</span></div>
    <div class="detail-stat"><span class="n" id="d-diff">—</span><span class="k">difficoltà</span></div>
    <div class="detail-stat detail-stat-surface"><span class="n" id="d-surface">—</span><span class="k">fondo</span></div>
  </div>
</div>

<!-- BODY -->
<main class="wrap detail-body">

  <div class="detail-cols">

    <div class="detail-left">
      <p class="detail-desc" id="detail-desc"></p>

      <div class="detail-highlights" id="detail-highlights"></div>

      <div class="detail-route">
        <div class="detail-route-pts">
          <span class="detail-pt start" id="d-start"></span>
          <span class="detail-route-line"></span>
          <span class="detail-pt end" id="d-end"></span>
        </div>
      </div>
    </div>

    <div class="detail-right">
      <div class="detail-map-wrap">
        <div id="detail-map"></div>
        <div class="detail-map-status" id="detail-map-status">Carico la rotta…</div>
      </div>
      <div class="detail-gpx-row">
        <button class="btn" id="detail-gpx-dl" disabled style="opacity:.5">↓ Scarica GPX</button>
        <p class="gpx-status" id="detail-gpx-status"></p>
      </div>
    </div>

  </div>

</main>

<footer class="site-foot">
  <div class="wrap">
    <p class="made">fatto con <span class="heart">♥</span> da <b>wakephul</b></p>
    <small>© <span id="year"></span> Disagio in Sella — routing © brouter.de · dati © OpenStreetMap</small>
  </div>
</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="js/main.js"></script>
<script src="js/itinerario.js"></script>
</body>
</html>
